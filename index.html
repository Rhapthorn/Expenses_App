<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <script src="./node_modules/chart.js/dist/chart.umd.js"></script>
</head>
<body>
<div class="title-bar">
    <span data-i18n="appTitle">Expense Tracker</span>
    <div class="window-controls">
        <button id="min-btn">&#8211;</button>
        <button id="max-btn">&#9633;</button>
        <button id="close-btn">X</button>
    </div>
</div>

<div class="container">
    <div class="insights-bar">
        <div class="salary-box">
            <label for="salary" data-i18n="netSalary">Net Salary:</label>
            <input type="number" id="salary" placeholder="0">
        </div>
        <div class="advice-box" id="advice-box"></div>
        <div style="display: flex; gap: 10px;">
            <button id="settings-btn" class="edit-btn" style="border: none; font-size: 14px;">⚙️ <span data-i18n="settings">Settings</span></button>
            <button id="export-btn" class="export-btn" data-i18n="exportExcel">Export to Excel</button>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 data-i18n="settings">Settings</h3>

            <div class="setting-group">
                <label data-i18n="language">Language</label>
                <select id="setting-language">
                    <option value="en">English</option>
                    <option value="el">Ελληνικά</option>
                </select>
            </div>

            <div class="setting-group">
                <label data-i18n="onClose">On Window Close (X)</label>
                <select id="setting-close">
                    <option value="tray" data-i18n="minimizeTray">Minimize to Tray</option>
                    <option value="quit" data-i18n="quitApp">Quit App</option>
                </select>
            </div>

            <div class="setting-group">
                <label data-i18n="currency">Currency</label>
                <select id="setting-currency">
                    <option value="€">€ (EUR)</option>
                    <option value="$">$ (USD)</option>
                    <option value="£">£ (GBP)</option>
                </select>
            </div>

            <div class="setting-group" style="flex-direction: row; align-items: center; justify-content: flex-start;">
                <input type="checkbox" id="setting-autolaunch" style="width: 16px; flex: none;">
                <label data-i18n="runStartup" style="margin-left: 8px;">Run on Startup</label>
            </div>

            <div class="modal-actions">
                <button id="save-settings-btn" class="save-btn" data-i18n="save">Save</button>
                <button id="cancel-settings-btn" class="delete-btn" data-i18n="cancel">Cancel</button>
            </div>
        </div>
    </div>

    <div class="goals-bar">
        <div class="goals-header">
            <h3 data-i18n="savingsGoals">Savings Goals</h3>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="goal-name" data-i18n="goalName" placeholder="Name (e.g. New GPU)">
                <input type="number" id="goal-target" data-i18n="goalTarget" placeholder="Target" style="width: 100px; flex: none;">
                <button id="add-goal-btn" data-i18n="setGoal">Set Goal</button>
            </div>
        </div>
        <div id="goals-list" class="goals-list"></div>
    </div>

    <div class="input-section">
        <input type="number" id="amount" data-i18n="amount" placeholder="Amount">

        <input type="text" id="tag" list="default-tags" data-i18n="tag" placeholder="Tag (e.g. Groceries)">
        <datalist id="default-tags">
            <option value="Supermarket"></option>
            <option value="Ενοίκιο/Δάνειο"></option>
            <option value="Λογαριασμοί"></option>
            <option value="Μετακινήσεις"></option>
            <option value="Φαγητό Έξω"></option>
            <option value="Gaming"></option>
            <option value="Υλικό PC"></option>
            <option value="Λογισμικό"></option>
            <option value="Υγεία"></option>
            <option value="Συνδρομές"></option>
            <option value="Ταξίδια"></option>
            <option value="Διασκέδαση"></option>
            <option value="Δώρα"></option>
            <option value="Ρούχα"></option>
        </datalist>

        <input type="date" id="date">

        <label class="checkbox-label" id="recurring-wrapper">
            <input type="checkbox" id="is-recurring"> <span data-i18n="recurring">Recurring Sub</span>
        </label>

        <button id="add-btn" data-i18n="logExpense">Log Expense</button>
    </div>

    <div class="dashboard">
        <div class="list-section">
            <h3 id="expense-list-header" data-i18n="recentExpenses">Recent Expenses</h3>
            <ul id="expense-list"></ul>
        </div>

        <div class="subs-section">
            <h3 data-i18n="activeSubs">Active Subs</h3>
            <ul id="subs-list"></ul>
        </div>

        <div class="chart-section">
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
